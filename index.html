<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSRS Market Tracker</title>
    <style>
        body { font-family: monospace; background: #121212; color: #e0e0e0; padding: 20px; }
        h1, h2 { color: #ff9800; }
        button { padding: 8px 12px; font-size: 14px; background: #2e7d32; color: white; border: none; cursor: pointer; border-radius: 4px; margin-right: 10px; }
        button:hover { background: #388e3c; }
        select { padding: 8px 12px; font-size: 14px; background: #252525; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 30px; }
        th, td { border: 1px solid #333; padding: 8px 12px; text-align: right; }
        th { background: #1e1e1e; text-align: center; }
        td:first-child { text-align: left; }
        .positive { color: #4caf50; font-weight: bold; }
        .negative { color: #f44336; font-weight: bold; }
        .item-header { background: #252525; font-weight: bold; text-align: left; color: #ffcc80; }
        .sub-row { color: #aaa; font-size: 0.9em; }
        .best-buy { color: #81c784; font-weight: bold; }
        .roi { color: #64b5f6; font-weight: bold; }
        .controls { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
    </style>
</head>
<body>

    <h1>OSRS Market Opportunity Tracker</h1>
    <div class="controls">
        <button onclick="calculateAll()">Refresh Live Prices</button>
        <label for="assembly-sort">Assembly Sort: </label>
        <select id="assembly-sort" onchange="calculateAll()">
            <option value="profit" selected>Net Profit (High to Low)</option>
            <option value="roi">ROI % (High to Low)</option>
            <option value="name">Item Name (A-Z)</option>
        </select>

        <label for="potion-sort">Potion Sort: </label>
        <select id="potion-sort" onchange="calculateAll()">
            <option value="custom" selected>Custom Score (Volume + Margin)</option>
            <option value="limitProfit">4h Limit Profit (High to Low)</option>
            <option value="profit">Net Profit per 4-dose (High to Low)</option>
            <option value="roi">ROI % (High to Low)</option>
            <option value="volume">24h Volume (High to Low)</option>
        </select>
        <span id="status"></span>
    </div>

    <h2>Item Assembly Margins</h2>
    <div id="assembly-output">Loading assembly data...</div>

    <h2>Potion Decanting Arbitrage</h2>
    <div id="decant-output">Loading dynamic potion data...</div>

    <script>
        const ASSEMBLY_RECIPES = [
            {
                name: "Masori Body (f)",
                output_id: 27238,
                fee: 0,
                inputs: [
                    { id: 27229, qty: 1, name: "Masori body" },
                    { id: 11828, qty: 1, name: "Armadyl chestplate (Yields 4 plates)" }
                ]
            },
            {
                name: "Masori Chaps (f)",
                output_id: 27241,
                fee: 0,
                inputs: [
                    { id: 27232, qty: 1, name: "Masori chaps" },
                    { id: 11830, qty: 1, name: "Armadyl chainskirt (Yields 3 plates)" }
                ]
            },
            {
                name: "Masori Mask (f)",
                output_id: 27235,
                fee: 0,
                inputs: [
                    { id: 27226, qty: 1, name: "Masori mask" },
                    { id: 11826, qty: 1, name: "Armadyl helmet (Yields 1 plate)" }
                ]
            },
            {
                name: "Venator Bow",
                output_id: 27612,
                fee: 0,
                inputs: [
                    { id: 27614, qty: 5, name: "Venator Shard" }
                ]
            },
            {
                name: "Webweaver Bow",
                output_id: 27655,
                fee: 0,
                inputs: [
                    { id: 22550, qty: 1, name: "Craw's Bow" },
                    { id: 27660, qty: 1, name: "Fangs of Venenatis" }
                ]
            },
            {
                name: "Ursine Chainmace",
                output_id: 27652,
                fee: 0,
                inputs: [
                    { id: 22542, qty: 1, name: "Viggora's Chainmace" },
                    { id: 27658, qty: 1, name: "Wilderness Hilt" }
                ]
            },
            {
                name: "Accursed Sceptre",
                output_id: 27662,
                fee: 0,
                inputs: [
                    { id: 22545, qty: 1, name: "Thammaron's Sceptre" },
                    { id: 27665, qty: 1, name: "Skull of Vet'ion" }
                ]
            },
            {
                name: "Necklace of Rupture",
                output_id: 33639,
                fee: 0,
                inputs: [
                    { id: 19547, qty: 1, name: "Necklace of Anguish" },
                    { id: 33636, qty: 1, name: "Etched Elder Venator Fang" }
                ]
            },
            {
                name: "Amulet of Rancour",
                output_id: 29801,
                fee: 0,
                inputs: [
                    { id: 19553, qty: 1, name: "Amulet of Torture" },
                    { id: 33534, qty: 1, name: "Etched Araxyte Fang" }
                ]
            },
            {
                name: "Voidwaker",
                output_id: 27690,
                fee: 500000,
                inputs: [
                    { id: 27681, qty: 1, name: "Voidwaker Blade" },
                    { id: 27684, qty: 1, name: "Voidwaker Hilt" },
                    { id: 27687, qty: 1, name: "Voidwaker Gem" }
                ]
            }
        ];

        async function fetchPrices() {
            const res = await fetch("https://prices.runescape.wiki/api/v1/osrs/latest", {
                headers: { "User-Agent": "CraftingTrackerWeb/1.0" }
            });
            const json = await res.json();
            return json.data || {};
        }

        async function fetchVolumes() {
            const res = await fetch("https://prices.runescape.wiki/api/v1/osrs/volumes", {
                headers: { "User-Agent": "CraftingTrackerWeb/1.0" }
            });
            const json = await res.json();
            return json.data || {};
        }

        async function getAllPotionGroups() {
            const res = await fetch("https://prices.runescape.wiki/api/v1/osrs/mapping", {
                headers: { "User-Agent": "CraftingTrackerWeb/1.0" }
            });
            const items = await res.json();
            
            const groups = {};
            const potionRegex = /^(.+?)\((\d)\)$/;

            for (const item of items) {
                const match = item.name.match(potionRegex);
                if (match) {
                    const baseName = match[1].trim();
                    const dose = parseInt(match[2]);
                    
                    if (!groups[baseName]) {
                        groups[baseName] = { name: baseName, ids: {}, limit: item.limit || 2000 };
                    }
                    groups[baseName].ids[dose] = item.id;
                }
            }

            return Object.values(groups).filter(p => p.ids[1] && p.ids[2] && p.ids[3] && p.ids[4]);
        }

        async function calculateAll() {
            document.getElementById("status").innerText = "Fetching live market, volume, & mapping data...";
            const prices = await fetchPrices();
            const volumes = await fetchVolumes();
            const potionList = await getAllPotionGroups();
            document.getElementById("status").innerText = "Updated at " + new Date().toLocaleTimeString();

            renderAssembly(prices);
            renderDecanting(prices, volumes, potionList);
        }

        function renderAssembly(prices) {
            const calculatedRecipes = [];

            for (const recipe of ASSEMBLY_RECIPES) {
                const outData = prices[recipe.output_id];
                if (!outData || !outData.low) continue;

                const grossSell = outData.low;
                const tax = Math.min(Math.floor(grossSell * 0.02), 5000000);
                const netRevenue = grossSell - tax;

                let totalCost = recipe.fee;
                const components = [];

                if (recipe.fee > 0) {
                    components.push({ name: "Assembly Fee", cost: recipe.fee, qty: 1 });
                }

                for (const input of recipe.inputs) {
                    const inData = prices[input.id];
                    if (!inData || !inData.high) {
                        totalCost = null;
                        break;
                    }
                    const unitPrice = inData.high;
                    const compCost = unitPrice * input.qty;
                    totalCost += compCost;

                    components.push({ name: input.name, cost: compCost, qty: input.qty });
                }

                if (totalCost === null) continue;

                const profit = netRevenue - totalCost;
                const roi = totalCost > 0 ? (profit / totalCost) * 100 : 0;

                calculatedRecipes.push({
                    name: recipe.name,
                    totalCost,
                    grossSell,
                    tax,
                    netRevenue,
                    profit,
                    roi,
                    components
                });
            }

            const sortBy = document.getElementById("assembly-sort").value;
            calculatedRecipes.sort((a, b) => {
                if (sortBy === "roi") return b.roi - a.roi;
                if (sortBy === "name") return a.name.localeCompare(b.name);
                return b.profit - a.profit;
            });

            let html = `<table>
                <thead>
                    <tr>
                        <th style="text-align:left;">Item / Component</th>
                        <th>Total Input Cost (Instabuy)</th>
                        <th>Product Sell Price (Instasell)</th>
                        <th>GE Tax (2%)</th>
                        <th>Net Revenue</th>
                        <th>Net Profit</th>
                        <th>ROI %</th>
                    </tr>
                </thead>
                <tbody>`;

            for (const recipe of calculatedRecipes) {
                const profitClass = recipe.profit >= 0 ? "positive" : "negative";

                let componentsHtml = "";
                for (const comp of recipe.components) {
                    componentsHtml += `<tr class="sub-row">
                        <td>└─ ${comp.name} ${comp.qty > 1 ? `(x${comp.qty.toLocaleString()})` : ""}</td>
                        <td>${comp.cost > 0 ? comp.cost.toLocaleString() : "-"}</td>
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    </tr>`;
                }

                html += `<tr class="item-header">
                    <td>${recipe.name}</td>
                    <td>${recipe.totalCost.toLocaleString()}</td>
                    <td>${recipe.grossSell.toLocaleString()}</td>
                    <td>-${recipe.tax.toLocaleString()}</td>
                    <td>${recipe.netRevenue.toLocaleString()}</td>
                    <td class="${profitClass}">${recipe.profit.toLocaleString()} GP</td>
                    <td class="roi">${recipe.roi.toFixed(1)}%</td>
                </tr>` + componentsHtml;
            }

            html += `</tbody></table>`;
            document.getElementById("assembly-output").innerHTML = html;
        }

        function renderDecanting(prices, volumes, potionList) {
            let html = `<table>
                <thead>
                    <tr>
                        <th style="text-align:left;">Potion</th>
                        <th>24h Volume</th>
                        <th>GE Limit</th>
                        <th>4-Dose Price</th>
                        <th>Best Buy Strategy</th>
                        <th>Profit / 4-dose</th>
                        <th>Est. 4h Limit Profit</th>
                        <th>ROI %</th>
                    </tr>
                </thead>
                <tbody>`;

            const results = [];

            for (const pot of potionList) {
                const p1 = prices[pot.ids[1]] ? prices[pot.ids[1]].high : null;
                const p2 = prices[pot.ids[2]] ? prices[pot.ids[2]].high : null;
                const p3 = prices[pot.ids[3]] ? prices[pot.ids[3]].high : null;
                const p4_sell = prices[pot.ids[4]] ? prices[pot.ids[4]].low : null;

                const vol4 = volumes[pot.ids[4]] || 0;

                if (!p4_sell || vol4 < 1500) continue;

                const options = [];
                if (p1) options.push({ dose: 1, unitPrice: p1, costFor4: p1 * 4 });
                if (p2) options.push({ dose: 2, unitPrice: p2, costFor4: p2 * 2 });
                if (p3) options.push({ dose: 3, unitPrice: p3, costFor4: (p3 / 3) * 4 });

                if (options.length === 0) continue;

                options.sort((a, b) => a.costFor4 - b.costFor4);
                const best = options[0];

                const grossSell = p4_sell;
                const tax = Math.min(Math.floor(grossSell * 0.02), 5000000);
                const netRevenue = grossSell - tax;
                const profit = netRevenue - best.costFor4;
                const roi = best.costFor4 > 0 ? (profit / best.costFor4) * 100 : 0;
                
                const limitProfit = profit * (pot.limit || 2000);
                const customScore = profit > 0 ? profit * Math.log10(vol4 + 1) : profit;

                results.push({
                    name: pot.name,
                    volume: vol4,
                    limit: pot.limit || 2000,
                    p4_sell,
                    bestDose: best.dose,
                    bestUnitPrice: best.unitPrice,
                    bestCostFor4: best.costFor4,
                    profit,
                    limitProfit,
                    roi,
                    customScore
                });
            }

            const sortBy = document.getElementById("potion-sort").value;
            results.sort((a, b) => {
                if (sortBy === "roi") return b.roi - a.roi;
                if (sortBy === "profit") return b.profit - a.profit;
                if (sortBy === "volume") return b.volume - a.volume;
                if (sortBy === "limitProfit") return b.limitProfit - a.limitProfit;
                return b.customScore - a.customScore;
            });

            for (const item of results) {
                const profitClass = item.profit >= 0 ? "positive" : "negative";
                const limitClass = item.limitProfit >= 0 ? "positive" : "negative";

                html += `<tr>
                    <td style="text-align:left; font-weight:bold;">${item.name}</td>
                    <td>${item.volume.toLocaleString()}</td>
                    <td>${item.limit.toLocaleString()}</td>
                    <td>${item.p4_sell.toLocaleString()} GP</td>
                    <td class="best-buy">Buy (${item.bestDose})-dose @ ${Math.round(item.bestUnitPrice).toLocaleString()} GP each <span style="color:#aaa; font-size:0.85em;">(= ${Math.round(item.bestCostFor4).toLocaleString()} total)</span></td>
                    <td class="${profitClass}">${Math.round(item.profit).toLocaleString()} GP</td>
                    <td class="${limitClass}">${Math.round(item.limitProfit).toLocaleString()} GP</td>
                    <td class="roi">${item.roi.toFixed(1)}%</td>
                </tr>`;
            }

            html += `</tbody></table>`;
            document.getElementById("decant-output").innerHTML = html;
        }

        calculateAll();
    </script>
</body>
</html>
